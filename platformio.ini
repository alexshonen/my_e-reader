; PlatformIO Project Configuration File for LilyGo T5 4.7" S3 E-Paper Reader
;
; Target SoC: ESP32-S3-WROOM-1 (16MB Flash, 8MB Octal PSRAM)
; Display: 4.7" ED047TC1 (540x960, 16 grayscale levels, LilyGo-EPD47 driver)

[platformio]
boards_dir = boards

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.6.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM1

; Octal PSRAM & Flash Configuration
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLILYGO_T5_EPD47_S3
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
